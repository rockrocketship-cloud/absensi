<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Karyawan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF2F0;--card:#FFFFFF;--ink:#14212B;--mute:#5B6B75;--line:#D5DDD9;--ok:#0E7C66;--okbg:#D8EFE8;--late:#B4410C;--latebg:#FBE3D3;--idle:#E4E9E7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A21;--card:#17252E;--ink:#E8EFEC;--mute:#93A5AE;--line:#27394380;--ok:#3FC3A3;--okbg:#14403A;--late:#F08A4B;--latebg:#44261A;--idle:#223540}}
:root[data-theme="dark"]{--bg:#0F1A21;--card:#17252E;--ink:#E8EFEC;--mute:#93A5AE;--line:#273943;--ok:#3FC3A3;--okbg:#14403A;--late:#F08A4B;--latebg:#44261A;--idle:#223540}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1,.clock,.big{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif}
h1{font-size:20px;margin:4px 0 14px;font-weight:700}
nav{display:flex;gap:4px;background:var(--idle);padding:4px;border-radius:12px;margin-bottom:16px}
nav button{flex:1;border:0;background:none;color:var(--mute);font:500 14px inherit;font-family:inherit;padding:9px 0;border-radius:9px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
select,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stage{text-align:center;padding:22px 16px 20px}
.date{color:var(--mute);margin-top:6px}
.clock{font-size:64px;font-weight:700;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.punch{display:block;width:100%;margin-top:18px;border:0;border-radius:14px;padding:16px;font:600 17px "IBM Plex Sans",sans-serif;color:#fff;background:var(--ok);cursor:pointer}
.punch.out{background:var(--ink);color:var(--bg)}
.punch:disabled{background:var(--idle);color:var(--mute);cursor:default}
.msg{min-height:22px;margin-top:10px;font-weight:500;color:var(--ok)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row small{display:block;color:var(--mute)}
.chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--idle);color:var(--mute);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.late{background:var(--latebg);color:var(--late)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.add{display:flex;gap:8px;margin-bottom:8px}
.add input{flex:1}
.btn{border:0;border-radius:10px;padding:10px 16px;font:600 14px "IBM Plex Sans",sans-serif;background:var(--ok);color:#fff;cursor:pointer}
.link{background:none;border:0;color:var(--late);font:500 14px "IBM Plex Sans",sans-serif;cursor:pointer;padding:6px}
.empty{color:var(--mute);padding:8px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sub{font-weight:600;margin:16px 0 6px}
.pv{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.add input,.add select{min-width:0}
.hide{display:none}
@media (prefers-reduced-motion:no-preference){.punch{transition:transform .12s}.punch:active{transform:scale(.98)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Absensi Karyawan</h1>
  <nav role="tablist">
    <button role="tab" data-t="absen" aria-selected="true">Absen</button>
    <button role="tab" data-t="rekap" aria-selected="false">Rekap</button>
    <button role="tab" data-t="staff" aria-selected="false">Karyawan</button>
    <button role="tab" data-t="lap" aria-selected="false">Laporan</button>
  </nav>

  <section id="absen">
    <div class="card stage">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date"></div>
      <div style="text-align:left;margin-top:18px">
        <label for="who">Nama karyawan</label>
        <select id="who"></select>
        <div class="date" id="sinfo" style="margin-top:8px"></div>
      </div>
      <button class="punch" id="punch">Absen masuk</button>
      <div class="msg" id="msg" role="status"></div>
    </div>
    <div class="card"><div id="today"></div></div>
  </section>

  <section id="rekap" class="hide">
    <div class="card">
      <label for="mon">Bulan</label>
      <input type="month" id="mon">
    </div>
    <div class="card scroll"><div id="recap"></div></div>
  </section>

  <section id="lap" class="hide">
    <div class="card">
      <label for="ld">Tanggal laporan</label><input type="date" id="ld">
      <div class="g2"><div><label for="lp">Pagi</label><input id="lp" placeholder="Nama/nama"></div><div><label for="ls">Sore</label><input id="ls" placeholder="Nama/nama"></div></div>
      <button class="link" id="lfill" style="padding-left:0;color:var(--ok)">Isi nama dari absensi</button>
    </div>
    <div class="card"><div class="sub" style="margin-top:0">Revenue</div><div class="g2" id="gA" style="margin-top:0"></div><div class="sub">Pembayaran dan AR invoice</div><div class="g2" id="gB" style="margin-top:0"></div></div>
    <div class="card"><div class="sub" style="margin-top:0">Pengeluaran</div><div id="lex"></div><button class="link" id="addex" style="padding-left:0;color:var(--ok)">+ Tambah pengeluaran</button>
      <div class="sub">Daily worker</div><div id="lwk"></div><button class="link" id="addwk" style="padding-left:0;color:var(--ok)">+ Tambah pekerja</button></div>
    <div class="card"><div id="lcalc"></div></div>
    <div class="card"><div class="sub" style="margin-top:0">Hasil laporan</div><div class="pv" id="lpv"></div>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="lcopy">Salin laporan</button><a class="btn" id="lwa" href="#" target="_blank" rel="noopener" style="text-decoration:none">Kirim ke WhatsApp</a></div><div class="msg" id="lmsg" role="status"></div></div>
  </section>

  <section id="staff" class="hide">
    <div class="card">
      <label for="nm">Tambah karyawan</label>
      <div class="add"><input id="nm" placeholder="Nama lengkap" maxlength="40"><select id="nsh" style="width:auto" aria-label="Shift"><option value="1">Shift 1</option><option value="2">Shift 2</option></select><button class="btn" id="addb">Tambah</button></div>
    </div>
    <div class="card"><div id="list"></div></div>
    <div class="card">
      <label>Jadwal shift (absen masuk setelah jam mulai dihitung terlambat)</label><div>Shift 1: 10:00 - 17:00<br>Shift 2: 17:00 - 00:00</div>
      
    </div>
  </section>
</div>

<script>
var KEY="absensi-karyawan-v1";
var S={emps:[],logs:{},shifts:{1:{s:"10:00",e:"17:00"},2:{s:"17:00",e:"00:00"}}};
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.emps)S=d}}catch(e){}
  S.shifts={1:{s:"10:00",e:"17:00"},2:{s:"17:00",e:"00:00"}};S.emps.forEach(function(m){if(!m.shift)m.shift=1});
  if(!S.emps.length&&!S.seeded){S.emps=[{id:"e1",name:"Sari Wulandari",shift:1},{id:"e2",name:"Budi Santoso",shift:2},{id:"e3",name:"Maya Putri",shift:1}];S.seeded=1}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function p(n){return String(n).padStart(2,"0")}
function dkey(d){return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function hm(d){return p(d.getHours())+":"+p(d.getMinutes())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(i){return document.getElementById(i)}
function mins(t){var a=t.split(":");return +a[0]*60+ +a[1]}
function entry(date,id){return(S.logs[date]||{})[id]}
function sh(m){return S.shifts[m.shift||1]}
function find(id){var n=new Date(),k=dkey(n),e=entry(k,id);if(e)return{k:k,e:e};var yk=dkey(new Date(n-864e5)),ye=entry(yk,id);if(ye&&!ye.out&&n.getHours()<6)return{k:yk,e:ye};return{k:k,e:null}}

function tick(){var d=new Date();
  $("clock").textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  $("date").textContent=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}

function fillWho(){var sel=$("who"),cur=sel.value;
  sel.innerHTML=S.emps.length?S.emps.map(function(e){return'<option value="'+e.id+'">'+esc(e.name)+"</option>"}).join(""):'<option value="">Belum ada karyawan</option>';
  if(cur&&S.emps.some(function(e){return e.id===cur}))sel.value=cur}

function renderAbsen(){
  var id=$("who").value,b=$("punch"),e=id&&find(id).e;
  b.disabled=false;b.className="punch";var mm=S.emps.filter(function(x){return x.id===id})[0];$("sinfo").textContent=mm?"Shift "+mm.shift+": "+sh(mm).s+" - "+sh(mm).e:"";
  if(!id){b.textContent="Tambah karyawan dulu";b.disabled=true}
  else if(!e){b.textContent="Absen masuk"}
  else if(!e.out){b.textContent="Absen pulang";b.className="punch out"}
  else{b.textContent="Absensi hari ini selesai";b.disabled=true}
  var t=dkey(new Date());
  $("today").innerHTML=S.emps.length?S.emps.map(function(m){var x=find(m.id).e,c="",l="Belum hadir",sub="";
    if(x){var late=mins(x.in)>mins(sh(m).s);c=late?"late":"ok";l=late?"Terlambat":"Hadir";sub="Masuk "+x.in+(x.out?" · Pulang "+x.out:"")}
    return'<div class="row"><div>'+esc(m.name)+"<small>Shift "+m.shift+(sub?" · "+sub:"")+'</small></div><span class="chip '+c+'">'+l+"</span></div>"}).join(""):'<div class="empty">Belum ada karyawan. Buka tab Karyawan untuk menambahkan.</div>'}

$("punch").onclick=function(){
  var id=$("who").value;if(!id)return;
  var n=new Date(),emp=S.emps.filter(function(e){return e.id===id})[0],name=emp.name,f=find(id),k=f.k;
  S.logs[k]=S.logs[k]||{};var e=f.e,m=$("msg");
  if(!e){S.logs[k][id]={in:hm(n)};var late=mins(hm(n))>mins(sh(emp).s);
    m.style.color=late?"var(--late)":"var(--ok)";m.textContent=name+" masuk pukul "+hm(n)+(late?" (terlambat)":"")}
  else if(!e.out){e.out=hm(n);m.style.color="var(--ok)";m.textContent=name+" pulang pukul "+hm(n)}
  save();renderAbsen()};
$("who").onchange=function(){$("msg").textContent="";renderAbsen()};

function renderRecap(){
  var mo=$("mon").value;if(!mo)return;
  var rows=S.emps.map(function(m){var h=0,l=0,tot=0;
    Object.keys(S.logs).forEach(function(d){if(d.indexOf(mo)!==0)return;var x=S.logs[d][m.id];if(!x)return;
      h++;if(mins(x.in)>mins(sh(m).s))l++;if(x.out)tot+=(mins(x.out)-mins(x.in)+1440)%1440});
    return'<tr><td>'+esc(m.name)+'</td><td class="n">'+h+'</td><td class="n">'+l+'</td><td class="n">'+(tot/60).toFixed(1)+"</td></tr>"}).join("");
  $("recap").innerHTML=S.emps.length?'<table><thead><tr><th>Nama</th><th class="n">Hadir</th><th class="n">Terlambat</th><th class="n">Jam kerja</th></tr></thead><tbody>'+rows+"</tbody></table>":'<div class="empty">Belum ada data.</div>'}
$("mon").onchange=renderRecap;

function renderStaff(){
  $("list").innerHTML=S.emps.length?S.emps.map(function(m){return'<div class="row"><span>'+esc(m.name)+'</span><span><select data-id="'+m.id+'" aria-label="Shift '+esc(m.name)+'" style="width:auto;padding:6px 8px"><option value="1"'+(m.shift==1?" selected":"")+'>Shift 1</option><option value="2"'+(m.shift==2?" selected":"")+'>Shift 2</option></select><button class="link" data-del="'+m.id+'">Hapus</button></span></div>'}).join(""):'<div class="empty">Belum ada karyawan.</div>';
  }
$("list").onclick=function(ev){var id=ev.target.getAttribute("data-del");if(!id)return;
  var m=S.emps.filter(function(e){return e.id===id})[0];
  if(!confirm("Hapus "+m.name+" beserta riwayat absensinya?"))return;
  S.emps=S.emps.filter(function(e){return e.id!==id});
  Object.keys(S.logs).forEach(function(d){delete S.logs[d][id]});
  save();fillWho();renderStaff();renderAbsen()};
function addEmp(){var v=$("nm").value.trim();if(!v)return;
  S.emps.push({id:"e"+Date.now(),name:v,shift:+$("nsh").value});$("nm").value="";save();fillWho();renderStaff();renderAbsen()}
$("addb").onclick=addEmp;
$("nm").onkeydown=function(e){if(e.key==="Enter")addEmp()};
$("list").onchange=function(ev){var id=ev.target.getAttribute("data-id");if(!id)return;S.emps.forEach(function(m){if(m.id===id)m.shift=+ev.target.value});save();renderAbsen()};

document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
  ["absen","rekap","staff","lap"].forEach(function(t){$(t).classList.toggle("hide",t!==b.dataset.t)});
  if(b.dataset.t==="rekap")renderRecap();if(b.dataset.t==="staff")renderStaff();if(b.dataset.t==="lap")loadLap()}});

var LF={rev:"Revenue Lokalin",refund:"Refund sales",co:"Compliment owner",ce:"Compliment entertainment",disc:"Total discount",edc:"EDC payment",mdr:"Bank transfer Mandiri",qris:"Other QRIS",gofood:"Online GoFood",ar:"AR invoice"};
var R=null;
function newR(){return{pagi:"",sore:"",v:{},ex:[{n:"Pemakaian Cash",a:""}],wk:[{n:"",r:"",a:""}]}}
function num(x){var n=parseInt(String(x||"").replace(/\D/g,""),10);return isNaN(n)?0:n}
function rp(n){return n?"Rp. "+n.toLocaleString("id-ID"):"Rp. -"}
function totals(){var v=R.v,g=num(v.rev)-num(v.refund)-num(v.co)-num(v.ce)-num(v.disc);return{g:g,nett:g-num(v.ar),ex:R.ex.reduce(function(s,e){return s+num(e.a)},0)}}
function lapText(){var v=R.v,t=totals(),d=new Date($("ld").value+"T00:00:00");
  var ds=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  var L=["*Daily Report Cafe*","Date: "+ds,"Name : *PAGI* "+R.pagi,"*SORE* "+R.sore,"","*REVENUE LOKALIN* > "+rp(num(v.rev)),"",
  "- REFUND SALES "+rp(num(v.refund)),"- Compliment Owner "+rp(num(v.co)),"- Compliment Entertainment "+rp(num(v.ce)),"- Total Discount "+rp(num(v.disc)),"",
  "*GRAND TOTAL* "+rp(t.g),"","*PAYMENT*","","EDC Payment. "+rp(num(v.edc)),"","BANK TRANSFER MANDIRI. "+rp(num(v.mdr)),"","Other Qris "+rp(num(v.qris)),"","Online GoFood "+rp(num(v.gofood)),"","*AR INVOICE* "+rp(num(v.ar)),"","*NETT REVENUE*. "+rp(t.nett),"","*TERIMAKASIH*","","","*PENGELUARAN*",""];
  R.ex.forEach(function(e){if(e.n||num(e.a))L.push("- "+(e.n||"-")+" : "+(num(e.a)?rp(num(e.a)):"-"))});
  L.push("","*TOTAL* "+rp(t.ex),"","*Daily Worker* :");
  R.wk.forEach(function(w){if(w.n)L.push("- *"+w.n+(w.r?" ("+w.r+")":"")+" : "+rp(num(w.a))+"*")});
  return L.join("\n")}
function renderLap(){
  var f=function(k){return'<div><label for="f_'+k+'">'+LF[k]+'</label><input id="f_'+k+'" data-k="'+k+'" inputmode="numeric" value="'+esc(R.v[k]||"")+'"></div>'};
  $("gA").innerHTML=["rev","refund","co","ce","disc"].map(f).join("");
  $("gB").innerHTML=["edc","mdr","qris","gofood","ar"].map(f).join("");
  $("lex").innerHTML=R.ex.map(function(e,i){return'<div class="add"><input data-ex="'+i+'" data-f="n" value="'+esc(e.n)+'" placeholder="Keperluan"><input data-ex="'+i+'" data-f="a" inputmode="numeric" value="'+esc(e.a)+'" placeholder="Rp" style="max-width:100px"><button class="link" data-rx="'+i+'">Hapus</button></div>'}).join("");
  $("lwk").innerHTML=R.wk.map(function(w,i){return'<div class="add"><input data-w="'+i+'" data-f="n" value="'+esc(w.n)+'" placeholder="Nama"><input data-w="'+i+'" data-f="r" value="'+esc(w.r)+'" placeholder="Posisi" style="max-width:80px"><input data-w="'+i+'" data-f="a" inputmode="numeric" value="'+esc(w.a)+'" placeholder="Rp" style="max-width:90px"><button class="link" data-rw="'+i+'">Hapus</button></div>'}).join("")}
function upd(sv){var t=totals(),s=lapText();
  if(sv){S.reports=S.reports||{};S.reports[$("ld").value]=R;save()}
  $("lcalc").innerHTML='<div class="row"><span>Grand total</span><b>'+rp(t.g)+'</b></div><div class="row"><span>Nett revenue</span><b>'+rp(t.nett)+'</b></div><div class="row"><span>Total pengeluaran</span><b>'+rp(t.ex)+'</b></div>';
  $("lpv").textContent=s;$("lwa").href="https://wa.me/?text="+encodeURIComponent(s)}
function loadLap(){if(!$("ld").value)$("ld").value=dkey(new Date());
  S.reports=S.reports||{};R=S.reports[$("ld").value]||newR();
  $("lp").value=R.pagi;$("ls").value=R.sore;$("lmsg").textContent="";renderLap();upd(false)}
function copyTxt(){var s=lapText(),m=$("lmsg");
  function fb(){var ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");m.textContent="Laporan disalin"}catch(e){m.textContent="Gagal menyalin. Salin manual dari kotak hasil laporan."}document.body.removeChild(ta)}
  try{navigator.clipboard.writeText(s).then(function(){m.textContent="Laporan disalin"},fb)}catch(e){fb()}}
$("ld").onchange=loadLap;
$("lap").oninput=function(ev){var t=ev.target,d=t.dataset;
  if(d.k)R.v[d.k]=t.value;
  else if(d.ex!==undefined)R.ex[+d.ex][d.f]=t.value;
  else if(d.w!==undefined)R.wk[+d.w][d.f]=t.value;
  else if(t.id==="lp")R.pagi=t.value;
  else if(t.id==="ls")R.sore=t.value;
  else return;
  upd(true)};
$("lap").onclick=function(ev){var t=ev.target,d=t.dataset;
  if(d.rx!==undefined)R.ex.splice(+d.rx,1);
  else if(d.rw!==undefined)R.wk.splice(+d.rw,1);
  else if(t.id==="addex")R.ex.push({n:"",a:""});
  else if(t.id==="addwk")R.wk.push({n:"",r:"",a:""});
  else if(t.id==="lfill"){var dt=$("ld").value,a=[],b=[];S.emps.forEach(function(m){if(entry(dt,m.id))(m.shift==2?b:a).push(m.name)});R.pagi=a.join("/");R.sore=b.join("/");$("lp").value=R.pagi;$("ls").value=R.sore}
  else if(t.id==="lcopy"){copyTxt();return}
  else return;
  renderLap();upd(true)};

load();$("mon").value=dkey(new Date()).slice(0,7);
fillWho();renderAbsen();tick();setInterval(tick,1000);
</script>
</body>
</html>
